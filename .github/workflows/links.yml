# Report broken links, internal and external. Report-only: old posts link to
# many sites that no longer exist, so this never blocks a deploy. Results show
# up in the run's summary.
name: Check links

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: hugo --gc --minify
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 2
            --accept 200..=299,403,429
            --root-dir "${{ github.workspace }}/public"
            --remap "https://words.yudocaa.in file://${{ github.workspace }}/public"
            --index-files index.html
            --exclude "^https?://(www\.)?(twitter|x|linkedin|facebook)\.com"
            --exclude "^https://fonts\.(googleapis|gstatic)\.com"
            "public/**/*.html"
