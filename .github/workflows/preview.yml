# Build every pull request and deploy it to Cloudflare Pages as a preview at
# https://pr-<number>.<project>.pages.dev, then link it from a PR comment.
# Production still deploys to GitHub Pages from hugo.yaml; previews never touch it.
#
# Setup, once: add the repository secrets CLOUDFLARE_API_TOKEN (a token with
# the Account > Cloudflare Pages > Edit permission) and CLOUDFLARE_ACCOUNT_ID.
# The first run creates the Pages project, named by the repository variable
# CLOUDFLARE_PAGES_PROJECT or else "words-yudocaa".
name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A newer push to the same PR makes an in-flight preview pointless.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # PRs from forks don't get the secrets, so there is nothing to deploy with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'words-yudocaa' }}
      BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Find the preview URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # First run only: make the project. Its production branch is never
          # deployed to; production stays on GitHub Pages.
          if ! npx --yes wrangler pages project list | grep -qw "$CLOUDFLARE_PAGES_PROJECT"; then
            npx --yes wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=paper
          fi
          # pages.dev names are global, so the subdomain can differ from the
          # project name; ask for it rather than guess.
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            | jq -r .result.subdomain)
          echo "URL=https://${BRANCH}.${sub}" >> "$GITHUB_ENV"
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # Links and assets must point at the preview, not words.yudocaa.in.
        run: hugo --gc --minify --baseURL "$URL/"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler pages deploy public --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$BRANCH" --commit-hash="$SHA"
      - name: Link the preview from the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- cloudflare-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Preview:** ${process.env.URL}\n\nBuilt from ${sha}. Updates on every push.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
