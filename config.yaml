baseURL: "https://words.yudocaa.in"
title: "Intellectual Web"
pagination:
  pagerSize: 5
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false
enableEmoji: true
googleAnalytics:

minify:
    disableXML: true
    minifyOutput: true

permalinks:
  page:
    posts: "/:year/:month/:day/:slug/"
    # Talk write-ups moved out of /blog/ keep their original URLs.
    talks: "/blog/:slugorcontentbasename/"

languages:
    en:
        label: "English"
        locale: "en-US"
        weight: 1
        menu:
            main:
                - name: /paths
                  url: /paths/
                  weight: 1
                - name: /writings
                  url: /writings/
                  weight: 2
                - name: /notes
                  url: /notes/
                  weight: 3
                - name: /talks
                  url: /talks/
                  weight: 4
                - name: /books
                  url: /books/
                  weight: 5
                - name: /about
                  url: /about/
                  weight: 6
                - name: /search
                  url: /search/
                  weight: 10

outputs:
    home:
        - HTML
        - RSS
        - JSON

params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Container internals, immutable Linux (Flatcar) and Kubernetes release engineering: notes from Sayan Chowdhury."
    mainSections:
      - blog
      - tutorials
      - cheatsheets
    rssExcludeSections:
      - fitness
      - hope
      - journal
      - log
      - notes
    author:
    - Sayan Chowdhury
    # author: ["Me", "You"] # multiple authors
    DateFormat: "2 January 2006"

    defaultTheme: auto
    disableThemeToggle: false
    ShowShareButtons: false # replaced by the "Copy link" button at the end of posts
    ShowReadingTime: true
    disableSpecial1stPost: false
    displayFullLangName: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowToc: true
    ShowFullTextinRSS: true
    comments: false # giscus is not set up yet (needs Discussions + the giscus app)
    images:
    - /images/2021-12-24-man-at-the-library.jpg

    profileMode:
        enabled: false
        title: Intellectual Web
        imageUrl: "#"
        imageTitle: my image
        imageWidth: 120
        imageHeight: 120
        buttons:
            - name: Archives
              url: archives
            - name: Tags
              url: tags

    socialIcons:
        #- name: KoFi
          #url: "https://ko-fi.com/yudocaa"
        #- name: github
          #url: "https://github.com/sayanchowdhury"
        - name: email
          url: "mailto:namoskar@yudocaa.in"
        - name: twitter
          url: "https://twitter.com/yudocaa"
        - name: github
          url: "https://github.com/sayanchowdhury"
        - name: RSS
          url: "index.xml"

    cover:
         hidden: true # hide everywhere but not in structured data
         hiddenInList: true # hide on list pages and home
         hiddenInSingle: true # hide on single page

    fuseOpts:
         isCaseSensitive: false
         shouldSort: true
         location: 0
         distance: 1000
         threshold: 0.4
         minMatchCharLength: 0
         keys: ["title", "permalink", "summary", "content"]

    editPost:
        URL: "https://github.com/sayanchowdhury/words.yudocaa.in/tree/paper/content"
        Text: "Suggest Changes" # edit text
        appendFilePath: true # to append file path to Edit link

    label:
         text: "/"

    # analytics:
    #     google:
    #         SiteVerificationTag: "XYZabc"

    assets:
        favicon: "favicon.svg"
        favicon16x16: "favicon-16x16.png"
        favicon32x32: "favicon-32x32.png"
        apple_touch_icon: "apple-touch-icon.png"
        safari_pinned_tab: "safari-pinned-tab.svg"



taxonomies:
    category: categories
    tag: tags
    series: series
    topic: topics

markup:
    goldmark:
        renderer:
            unsafe: true
#     highlight:
#         # anchorLineNos: true
#         codeFences: true
#         guessSyntax: true
#         lineNos: true
#         # noClasses: false
#         style: monokai

privacy:
    vimeo:
        disabled: false
        simple: true

    x:
        disabled: false
        enableDNT: true
        simple: true

    instagram:
        disabled: false
        simple: true

    youtube:
        disabled: false
        privacyEnhanced: true

services:
    instagram:
        disableInlineCSS: true
    x:
        disableInlineCSS: true

# Also expose static/images as assets, so post images can be resized and
# served as WebP by the image render hook. The files and their /images/
# URLs are unchanged.
module:
    mounts:
        - source: static
          target: static
        - source: assets
          target: assets
        - source: static/images
          target: assets/images
