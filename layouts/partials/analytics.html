{{- /* Cloudflare Web Analytics: cookie-free, so no consent banner. Only on the
     real site; PR previews set params.preview (see .github/workflows/preview.yml). */}}
{{- with site.Params.analytics.cloudflare.token }}
{{- if and hugo.IsProduction (not site.Params.preview) }}
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ . }}"}'></script>
{{- end }}
{{- end }}
